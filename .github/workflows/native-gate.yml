# Native gate: the walker on an iOS simulator and an Android emulator.
#
# 1. web-walk runs the web walker (the e2e walker spec) once per native
#    platform, at that platform's own grid width, and uploads both report
#    sets: a cell capped by its host re-lays out with the room, so the
#    reference must have seen the same room to compare like with like.
# 2. ios and android build the Expo app in Release, start the walk server and
#    walk every template in light and dark (scripts/native-walk.js): Android by deep link,
#    nimbus://walk?theme=<t>&report=<url> from a stopped app (cold) and
#    nimbus://walk/<Family>?theme=<t> into the running app (warm); iOS by
#    server command (autopilot build, see the ios job), because iOS confirms
#    custom-scheme links from outside the app with a dialog. Each waits for
#    the report, screenshots every family,
#    then assert the reports (scripts/walk-assert.js): zero render errors,
#    every sample state measured with a size, the sans family drawn as
#    named, and every cell equal to the web run within one point.
# Simulator evidence is simulator evidence; real devices are a later claim.
#
# The component library is file:-linked from its sibling repository, so
# every job checks out both side by side. The library ref is the
# `library_ref` input when given, otherwise the one named in `library.ref`
# (the same pin CI uses), so a milestone tag walks what CI tested. Every job
# prints the library commit it checked out, so the evidence names what was
# walked.

name: Native Gate

on:
  workflow_dispatch:
    inputs:
      library_ref:
        description: Library branch, tag or SHA to walk (empty walks library.ref)
        required: false
        default: ''
      tablets:
        description: Also walk an iPad (portrait and landscape) and an Android tablet
        type: boolean
        required: false
        default: false
  push:
    tags: ['milestone-*']

permissions:
  contents: read
  packages: read

jobs:

  web-walk:
    name: Web walker reference
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: codebase-demo-client-rnw-v2
      - name: Library ref
        id: library
        env:
          LIBRARY_REF_INPUT: ${{ inputs.library_ref }}
        run: |
          ref="$LIBRARY_REF_INPUT"
          if [ -z "$ref" ]; then ref=$(tr -d '[:space:]' < codebase-demo-client-rnw-v2/library.ref); fi
          if [ -z "$ref" ]; then echo "FAIL: no library ref"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: superloomdev/rnw-components-v2
          ref: ${{ steps.library.outputs.ref }}
          path: codebase-rnw-components-v2
      - name: Library commit walked
        run: echo "library $(git -C codebase-rnw-components-v2 rev-parse HEAD) ($(git -C codebase-rnw-components-v2 rev-parse --abbrev-ref HEAD))"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install and build web host
        working-directory: codebase-demo-client-rnw-v2/hosts/web
        run: |
          npm ci
          npx vite build
      - name: Install web walker
        working-directory: codebase-demo-client-rnw-v2
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # The iOS simulator's grid reports 370 and the Android emulator's 288;
      # the walker's scroll padding (16 a side) sits between the viewport
      # and the grid width the report names. walk-assert fails the run when
      # the two grid widths differ, so a changed room cannot compare silently.
      # The reports move out of test-results at once: playwright empties its
      # outputDir at the start of every run, so a report left there does not
      # survive the next walk
      - name: Run the web walker at the iOS room
        working-directory: codebase-demo-client-rnw-v2
        env:
          WALK_VIEWPORT: '402'
        run: |
          npx playwright test e2e/walker.spec.js
          mkdir -p walk-out
          mv test-results/walk walk-out/ios
      - name: Run the web walker at the Android room
        working-directory: codebase-demo-client-rnw-v2
        env:
          WALK_VIEWPORT: '320'
        run: |
          npx playwright test e2e/walker.spec.js
          mv test-results/walk walk-out/android
      - name: Upload web reports (iOS room)
        uses: actions/upload-artifact@v7
        with:
          name: web-walk-ios
          path: codebase-demo-client-rnw-v2/walk-out/ios/
          retention-days: 14
      - name: Upload web reports (Android room)
        uses: actions/upload-artifact@v7
        with:
          name: web-walk-android
          path: codebase-demo-client-rnw-v2/walk-out/android/
          retention-days: 14

  ios:
    name: iOS simulator
    needs: [web-walk]
    runs-on: macos-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: codebase-demo-client-rnw-v2
      - name: Library ref
        id: library
        env:
          LIBRARY_REF_INPUT: ${{ inputs.library_ref }}
        run: |
          ref="$LIBRARY_REF_INPUT"
          if [ -z "$ref" ]; then ref=$(tr -d '[:space:]' < codebase-demo-client-rnw-v2/library.ref); fi
          if [ -z "$ref" ]; then echo "FAIL: no library ref"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: superloomdev/rnw-components-v2
          ref: ${{ steps.library.outputs.ref }}
          path: codebase-rnw-components-v2
      - name: Library commit walked
        run: echo "library $(git -C codebase-rnw-components-v2 rev-parse HEAD) ($(git -C codebase-rnw-components-v2 rev-parse --abbrev-ref HEAD))"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Download web reports (iOS room)
        uses: actions/download-artifact@v8
        with:
          name: web-walk-ios
          path: web-walk-ios
      - name: Install native assertion tools
        working-directory: codebase-demo-client-rnw-v2
        run: npm ci
      - name: Cache Pods
        uses: actions/cache@v6
        with:
          path: codebase-demo-client-rnw-v2/hosts/expo/ios/Pods
          key: pods-${{ hashFiles('codebase-demo-client-rnw-v2/hosts/expo/package-lock.json') }}
      # iOS confirms a custom-scheme link opened from outside the app with a
      # dialog no simulator command can tap, so this build carries the walk
      # server address (inlined at bundle time) and the app boots into the
      # autopilot, which takes its commands from the server
      - name: Install, prebuild and build Release on the simulator
        working-directory: codebase-demo-client-rnw-v2/hosts/expo
        env:
          EXPO_PUBLIC_WALK_SERVER: http://localhost:8787
        run: |
          npm ci
          npx expo prebuild --platform ios --no-install
          (cd ios && pod install)
          # The runner image's simulator set changes; take the first available
          # iPhone of the newest iOS runtime instead of naming one
          DEVICE=$(xcrun simctl list devices available -j | node ../../scripts/pick-simulator.js)
          echo "simulator: $DEVICE"
          npx expo run:ios --configuration Release --device "$DEVICE" --no-bundler
      - name: Walk every template
        working-directory: codebase-demo-client-rnw-v2
        run: |
          mkdir -p walk-out
          node scripts/walk-server.js --port 8787 --out walk-out > walk-out/walk-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/health && break; sleep 1; done
          node scripts/native-walk.js --platform ios --out walk-out --mode command
      - name: Assert the reports
        working-directory: codebase-demo-client-rnw-v2
        run: node scripts/walk-assert.js --platform ios --dir walk-out --web ../web-walk-ios
      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-walk
          path: codebase-demo-client-rnw-v2/walk-out/
          retention-days: 14

  android:
    name: Android emulator
    needs: [web-walk]
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GRADLE_OPTS: -Xmx4g
    steps:
      - uses: actions/checkout@v7
        with:
          path: codebase-demo-client-rnw-v2
      - name: Library ref
        id: library
        env:
          LIBRARY_REF_INPUT: ${{ inputs.library_ref }}
        run: |
          ref="$LIBRARY_REF_INPUT"
          if [ -z "$ref" ]; then ref=$(tr -d '[:space:]' < codebase-demo-client-rnw-v2/library.ref); fi
          if [ -z "$ref" ]; then echo "FAIL: no library ref"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: superloomdev/rnw-components-v2
          ref: ${{ steps.library.outputs.ref }}
          path: codebase-rnw-components-v2
      - name: Library commit walked
        run: echo "library $(git -C codebase-rnw-components-v2 rev-parse HEAD) ($(git -C codebase-rnw-components-v2 rev-parse --abbrev-ref HEAD))"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download web reports (Android room)
        uses: actions/download-artifact@v8
        with:
          name: web-walk-android
          path: web-walk-android
      - name: Install native assertion tools
        working-directory: codebase-demo-client-rnw-v2
        run: npm ci
      - name: Install, prebuild and assemble Release
        working-directory: codebase-demo-client-rnw-v2/hosts/expo
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          (cd android && ./gradlew assembleRelease)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk every template on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: codebase-demo-client-rnw-v2
          script: |
            adb install hosts/expo/android/app/build/outputs/apk/release/app-release.apk
            mkdir -p walk-out
            node scripts/walk-server.js --port 8787 --out walk-out > walk-out/walk-server.log 2>&1 &
            sleep 3
            node scripts/native-walk.js --platform android --out walk-out --report-host 10.0.2.2
      - name: Assert the reports
        working-directory: codebase-demo-client-rnw-v2
        run: node scripts/walk-assert.js --platform android --dir walk-out --web ../web-walk-android
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-walk
          path: codebase-demo-client-rnw-v2/walk-out/
          retention-days: 14

  # Tablet walks (workflow_dispatch only): the iPad job walks portrait and
  # landscape - the two widths land in different form classes (820 CSS
  # points is `medium`, 1194 is `expanded`) - and the Android job walks a
  # Pixel Tablet AVD, which boots landscape at 1280dp, the expanded class. Each web reference walk runs at that tablet's own
  # room, the same trick the phone jobs use, because a cell capped by its
  # host re-lays out with the room and only like-with-like compares.
  # The landscape iPad walk rotates the booted simulator through the
  # Simulator app's own Rotate Left shortcut (no public simctl verb exists
  # for it); a missed keystroke is caught by walk-assert's form-class and
  # grid-width mismatches rather than by a silent green.

  web-walk-tablet:
    name: Web walker references (tablets)
    needs: [web-walk]
    if: inputs.tablets == true
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: codebase-demo-client-rnw-v2
      - name: Library ref
        id: library
        env:
          LIBRARY_REF_INPUT: ${{ inputs.library_ref }}
        run: |
          ref="$LIBRARY_REF_INPUT"
          if [ -z "$ref" ]; then ref=$(tr -d '[:space:]' < codebase-demo-client-rnw-v2/library.ref); fi
          if [ -z "$ref" ]; then echo "FAIL: no library ref"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: superloomdev/rnw-components-v2
          ref: ${{ steps.library.outputs.ref }}
          path: codebase-rnw-components-v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install and build web host
        working-directory: codebase-demo-client-rnw-v2/hosts/web
        run: |
          npm ci
          npx vite build
      - name: Install web walker
        working-directory: codebase-demo-client-rnw-v2
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # iPad 11" viewport is 834 points portrait (medium class) and 1194
      # landscape (expanded); the walker's 16-a-side padding subtracts 32
      - name: Run the web walker at the iPad portrait room
        working-directory: codebase-demo-client-rnw-v2
        env:
          WALK_VIEWPORT: '834'
        run: |
          npx playwright test e2e/walker.spec.js
          mkdir -p walk-out
          mv test-results/walk walk-out/ipad-portrait
      - name: Run the web walker at the iPad landscape room
        working-directory: codebase-demo-client-rnw-v2
        env:
          WALK_VIEWPORT: '1194'
        run: |
          npx playwright test e2e/walker.spec.js
          mv test-results/walk walk-out/ipad-landscape
      # A Pixel Tablet boots landscape at 1280dp, the expanded class; the iPad covers medium (portrait) and expanded (landscape)
      - name: Run the web walker at the Android tablet room
        working-directory: codebase-demo-client-rnw-v2
        env:
          WALK_VIEWPORT: '1280'
        run: |
          npx playwright test e2e/walker.spec.js
          mv test-results/walk walk-out/android-tablet
      - name: Upload web reports (tablet rooms)
        uses: actions/upload-artifact@v7
        with:
          name: web-walk-tablets
          path: codebase-demo-client-rnw-v2/walk-out/
          retention-days: 14

  ios-tablet:
    name: iPad simulator
    needs: [web-walk-tablet]
    if: inputs.tablets == true
    runs-on: macos-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: codebase-demo-client-rnw-v2
      - name: Library ref
        id: library
        env:
          LIBRARY_REF_INPUT: ${{ inputs.library_ref }}
        run: |
          ref="$LIBRARY_REF_INPUT"
          if [ -z "$ref" ]; then ref=$(tr -d '[:space:]' < codebase-demo-client-rnw-v2/library.ref); fi
          if [ -z "$ref" ]; then echo "FAIL: no library ref"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: superloomdev/rnw-components-v2
          ref: ${{ steps.library.outputs.ref }}
          path: codebase-rnw-components-v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Download web reports (tablet rooms)
        uses: actions/download-artifact@v8
        with:
          name: web-walk-tablets
          path: web-walk-tablets
      - name: Install native assertion tools
        working-directory: codebase-demo-client-rnw-v2
        run: npm ci
      - name: Cache Pods
        uses: actions/cache@v4
        with:
          key: pods-${{ hashFiles('codebase-demo-client-rnw-v2/hosts/expo/ios/Podfile.lock') }}
          path: codebase-demo-client-rnw-v2/hosts/expo/ios/Pods
      - name: Install, prebuild and build Release on the iPad
        working-directory: codebase-demo-client-rnw-v2/hosts/expo
        env:
          EXPO_PUBLIC_WALK_SERVER: 'http://localhost:8787'
        run: |
          npm ci
          npx expo prebuild --platform ios --no-install
          (cd ios && pod install)
          DEVICE=$(xcrun simctl list devices available -j | node ../../scripts/pick-simulator.js ipad)
          echo "simulator: $DEVICE"
          npx expo run:ios --configuration Release --device "$DEVICE" --no-bundler
      - name: Walk every template (portrait)
        working-directory: codebase-demo-client-rnw-v2
        run: |
          mkdir -p walk-out/ipad-portrait
          node scripts/walk-server.js --port 8787 --out walk-out/ipad-portrait > walk-out/ipad-portrait/walk-server.log 2>&1 & echo $! > walk-out/ipad-portrait/server.pid
          sleep 3
          node scripts/native-walk.js --platform ios --out walk-out/ipad-portrait --mode command
      - name: Rotate and walk every template (landscape)
        working-directory: codebase-demo-client-rnw-v2
        run: |
          open -a Simulator
          sleep 2
          osascript -e 'tell application "System Events" to keystroke "l" using command down' || true
          sleep 3
          kill "$(cat walk-out/ipad-portrait/server.pid)" || true; sleep 1
          mkdir -p walk-out/ipad-landscape
          node scripts/walk-server.js --port 8787 --out walk-out/ipad-landscape > walk-out/ipad-landscape/walk-server.log 2>&1 &
          sleep 3
          node scripts/native-walk.js --platform ios --out walk-out/ipad-landscape --mode command --port 8787
      - name: Assert the reports
        working-directory: codebase-demo-client-rnw-v2
        run: |
          node scripts/walk-assert.js --platform ios --dir walk-out/ipad-portrait --web ../web-walk-tablets/ipad-portrait
          node scripts/walk-assert.js --platform ios --dir walk-out/ipad-landscape --web ../web-walk-tablets/ipad-landscape
      - name: Upload iPad evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipad-walk
          path: codebase-demo-client-rnw-v2/walk-out/
          retention-days: 14

  android-tablet:
    name: Android tablet emulator
    needs: [web-walk-tablet]
    if: inputs.tablets == true
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GRADLE_OPTS: -Xmx4g
    steps:
      - uses: actions/checkout@v7
        with:
          path: codebase-demo-client-rnw-v2
      - name: Library ref
        id: library
        env:
          LIBRARY_REF_INPUT: ${{ inputs.library_ref }}
        run: |
          ref="$LIBRARY_REF_INPUT"
          if [ -z "$ref" ]; then ref=$(tr -d '[:space:]' < codebase-demo-client-rnw-v2/library.ref); fi
          if [ -z "$ref" ]; then echo "FAIL: no library ref"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: superloomdev/rnw-components-v2
          ref: ${{ steps.library.outputs.ref }}
          path: codebase-rnw-components-v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download web reports (Android tablet room)
        uses: actions/download-artifact@v8
        with:
          name: web-walk-tablets
          path: web-walk-tablets
      - name: Install native assertion tools
        working-directory: codebase-demo-client-rnw-v2
        run: npm ci
      - name: Install, prebuild and assemble Release
        working-directory: codebase-demo-client-rnw-v2/hosts/expo
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          (cd android && ./gradlew assembleRelease)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk every template on the tablet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          working-directory: codebase-demo-client-rnw-v2
          script: |
            adb install hosts/expo/android/app/build/outputs/apk/release/app-release.apk
            mkdir -p walk-out
            node scripts/walk-server.js --port 8787 --out walk-out > walk-out/walk-server.log 2>&1 &
            sleep 3
            node scripts/native-walk.js --platform android --out walk-out --report-host 10.0.2.2
      - name: Assert the reports
        working-directory: codebase-demo-client-rnw-v2
        run: node scripts/walk-assert.js --platform android --dir walk-out --web ../web-walk-tablets/android-tablet
      - name: Upload Android tablet evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-tablet-walk
          path: codebase-demo-client-rnw-v2/walk-out/
          retention-days: 14
